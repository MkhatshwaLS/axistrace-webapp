<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AxisTrace</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="app-shell">
        <div class="card form-card">
            <div class="form-header">
                <p class="eyebrow">Create account</p>
                <h1>Register</h1>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="register-username">Username</label>
                    <input type="text" id="register-username" name="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="register-password">Password</label>
                    <input type="password" id="register-password" name="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirmPassword" placeholder="Confirm password" required>
                </div>
                <div class="form-actions">
                    <button type="submit">Create account</button>
                    <a class="secondary-btn" href="login.html">Back to login</a>
                </div>
            </form>
            <div id="error-message" class="error-message"></div>
            <div class="inline-links">
                <span>Already have an account?</span>
                <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
